name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: check
        run: |
          gofmt_out=$(gofmt -l cmd internal)
          if [ -n "$gofmt_out" ]; then
            echo "gofmt needed on:"; echo "$gofmt_out"; exit 1
          fi
          go vet ./...
          go test ./...

      - name: verify the tag matches the module path
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "tag must start with v, got $tag"; exit 1 ;;
          esac
          # install.sh derives the asset name from the version, so a tag
          # that does not match the module path silently produces assets
          # nobody can install.
          mod=$(go list -m)
          case "$mod" in
            github.com/*) ;;
            *) echo "unexpected module path: $mod"; exit 1 ;;
          esac

      # GoReleaser's sboms: step shells out to syft, which the runner does
      # not have. Without this the release fails at the last step, after
      # the build and checksum work has already been done.
      - name: install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
